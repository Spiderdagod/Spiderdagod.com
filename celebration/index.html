<style>
:root{
  color-scheme:dark;
  --night:#110e10; --ash:#1b1719; --rule:#2e2729; --bone:#ece4d6; --dust:#a59a8c;
  --gold:#d1a84e;
  --display:"Grenze Gotisch", Georgia, serif;
  --body:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono:"DM Mono", ui-monospace, Menlo, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:var(--bone);font-family:var(--body);font-size:16px;line-height:1.5}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:460px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dust);margin:0;text-align:center}
.cover{width:100%;height:auto;aspect-ratio:1;object-fit:cover;display:block;border:1px solid var(--rule);background:var(--ash)}
h1{margin:0;text-align:center;font-family:var(--display);font-weight:900;font-size:clamp(44px,13vw,64px);line-height:.95}
h1 span{display:block;font-family:var(--body);font-weight:800;font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-top:10px}
.links{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.links li{border-bottom:1px solid var(--rule)}
.links a{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 4px;text-decoration:none;font-weight:600;font-size:17px;min-height:56px}
.links a:hover{color:var(--gold)}
.links .go{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--bone);padding:7px 14px;white-space:nowrap}
.links a:hover .go{border-color:var(--gold);color:var(--night);background:var(--gold)}
.links .primary .go{background:var(--gold);border-color:var(--gold);color:var(--night)}
.foot{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;font-family:var(--mono);font-size:13px;color:var(--dust)}
.foot a{text-decoration:none}
.foot a:hover{color:var(--bone)}
</style>
</head>
<body>
<main class="wrap">
  <p class="kicker">Spiderdagod · from the EP Godfall</p>
  <img class="cover" src="../celebration-art.jpg" alt="Celebration single cover: a crowned skull in a red sweater at a party table with a cake" width="1000" height="1000">
  <h1>Celebration<span>Out now everywhere</span></h1>

<script>
// Count which platform people pick (shows up in Google Analytics as "select_platform").
document.querySelectorAll('.links a').forEach(function(a){
  a.addEventListener('click', function(){
    try { gtag('event','select_platform',{platform:a.dataset.platform, song:'celebration'}); } catch(e){}
  });
});
</script>
